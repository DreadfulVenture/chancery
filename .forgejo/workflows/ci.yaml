name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_test: ${{ steps.filter.outputs.test }}
      run_zenigata: ${{ steps.filter.outputs.zenigata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            test:
              - 'memory/**'
              - 'review/forgejo-adapter/**'
              - 'watch/**'
              - 'wake/**'
              - 'coordinate/**'
              - 'writs/plan-reminder/**'
              - 'writs/discovery-reminder/**'
              - 'nix/**'
              - 'Makefile'
              - 'flake.nix'
              - 'flake.lock'
              - '.forgejo/**'
              - '.envrc'
              - '.pre-commit-config.yaml'
              - '.gitignore'
              - '.prettierrc'
              - 'renovate.json'
            zenigata:
              - 'review/zenigata/**'
              - 'review/forgejo-adapter/**'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Run pre-commit hooks
        run: nix develop -c pre-commit run --all-files

      # Covers this runner's system only, which is the point: the systemd
      # service path in the home-manager module has no one exercising it by
      # hand the way the launchd path does.
      - name: Check the home-manager module
        run: nix flake check

  test:
    needs: changes
    if: needs.changes.outputs.run_test == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install Python
        run: uv python install 3.12

      - name: Run tests
        run: make test

  zenigata:
    needs: changes
    if: needs.changes.outputs.run_zenigata == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install dependencies
        working-directory: review/zenigata
        run: npm ci

      - name: Run vitest
        working-directory: review/zenigata
        run: npm test

      - name: Typecheck
        working-directory: review/zenigata
        run: npm run typecheck
